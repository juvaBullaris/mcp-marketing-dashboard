services:
  extractor:
    build: .
    env_file: .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/ga-service-account.json
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
    # Pull fresh data every 6 hours.
    command: sh -c "while true; do python -m extractor.run extract; sleep 21600; done"
    restart: unless-stopped

  dashboard:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    restart: unless-stopped
